name: budget_buddy_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  fl_chart: ^1.2.0
  google_mlkit_text_recognition: ^0.15.1
  intl: ^0.20.2
  uuid: ^4.4.0
